<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F05A28">
    <link rel="apple-touch-icon" href="/img/icons/icon-192x192.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Maestro | Mi Smartech Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        tr {
            transition: background-color 0.2s ease;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(5px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body
    class="bg-slate-50 font-sans text-brand-black flex h-screen overflow-hidden selection:bg-brand-orange selection:text-white" style="display: none;">

    <div id="admin-sidebar"></div>

    <main class="flex-grow overflow-y-auto flex flex-col no-scrollbar relative">

        <header
            class="bg-white/90 backdrop-blur-xl border-b border-gray-100 px-4 sm:px-10 py-4 sm:py-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sticky top-0 z-40 shadow-sm transition-all">
            <div>
                <h2 class="font-black text-[10px] uppercase tracking-[0.3em] text-gray-400 mb-1">Catálogo Maestro</h2>
                <h1 class="text-2xl sm:text-3xl font-black text-brand-black tracking-tighter uppercase">Gestión de <span
                        class="text-brand-orange">Inventario</span></h1>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-end flex-wrap">
                <button onclick="exportInventoryToExcel()"
                    class="flex-1 sm:flex-initial bg-white border border-gray-200 text-brand-black px-4 sm:px-5 py-3 sm:py-3.5 rounded-2xl font-black uppercase text-[10px] tracking-[0.15em] sm:tracking-[0.2em] shadow-md hover:bg-brand-orange hover:text-white hover:border-brand-orange hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-excel text-emerald-600 text-sm"></i> <span class="whitespace-nowrap">Exportar Excel</span>
                </button>
                <button onclick="triggerImportExcel()"
                    class="flex-1 sm:flex-initial bg-white border border-gray-200 text-brand-black px-4 sm:px-5 py-3 sm:py-3.5 rounded-2xl font-black uppercase text-[10px] tracking-[0.15em] sm:tracking-[0.2em] shadow-md hover:bg-blue-600 hover:text-white hover:border-blue-600 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-import text-blue-600 text-sm"></i> <span class="whitespace-nowrap">Importar Excel</span>
                </button>
                <input type="file" id="excel-file-input" accept=".xlsx,.csv" class="hidden" onchange="importInventoryFromExcel(event)">
                <button onclick="window.location.href='create-product.html'"
                    class="flex-1 sm:flex-initial bg-brand-black text-white px-5 sm:px-6 py-3 sm:py-3.5 rounded-2xl font-black uppercase text-[10px] tracking-[0.15em] sm:tracking-[0.2em] shadow-xl hover:bg-brand-orange hover:text-white hover:shadow-orange-500/20 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> <span class="whitespace-nowrap">Nuevo Producto</span>
                </button>
            </div>
        </header>

        <div class="p-4 sm:p-6 lg:p-10 max-w-[1600px] mx-auto w-full pb-20">

            <div class="flex flex-col gap-3.5 mb-6">
                
                <!-- Buscador y Pestañas de Estado Rápidas -->
                <div class="flex flex-col xl:flex-row gap-3 justify-between items-stretch xl:items-center">
                    <form id="search-form" class="relative flex-1 group" onsubmit="event.preventDefault();">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-sm">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <input type="text" id="inventory-search"
                            placeholder="Buscar por nombre, SKU, marca, categoría..."
                            class="w-full h-11 bg-white border border-gray-200 rounded-xl py-2.5 pl-11 pr-9 text-xs font-bold outline-none focus:border-brand-orange focus:ring-4 focus:ring-orange-500/10 transition-all shadow-2xs placeholder-gray-400 text-brand-black">
                        <button type="button" id="btn-clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 transition p-1">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </form>

                    <!-- Pestañas Rápidas con Scroll Horizontal Touch -->
                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
                        <button onclick="filterByTab('all')" id="tab-all" class="tab-btn active shrink-0 px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-brand-black text-white shadow-sm transition-all hover:-translate-y-0.5 border border-transparent">
                            Todos
                        </button>
                        <button onclick="filterByTab('active')" id="tab-active" class="tab-btn shrink-0 px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-white text-gray-500 border border-gray-200 hover:text-brand-orange hover:border-brand-orange transition-all hover:-translate-y-0.5 shadow-2xs">
                            <i class="fa-solid fa-circle text-[7px] text-emerald-500 mr-1"></i> Activos
                        </button>
                        <button onclick="filterByTab('draft')" id="tab-draft" class="tab-btn shrink-0 px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-white text-gray-500 border border-gray-200 hover:text-brand-orange hover:border-brand-orange transition-all hover:-translate-y-0.5 shadow-2xs">
                            <i class="fa-solid fa-circle text-[7px] text-amber-400 mr-1"></i> Borradores
                        </button>
                        <button onclick="filterByTab('lowstock')" id="tab-lowstock" class="tab-btn shrink-0 px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-white text-gray-500 border border-gray-200 hover:text-brand-red hover:border-brand-red transition-all hover:-translate-y-0.5 shadow-2xs">
                            <i class="fa-solid fa-circle-exclamation text-brand-red mr-1"></i> Stock Bajo (≤ 5)
                        </button>
                        <button onclick="filterByTab('out_of_stock')" id="tab-out_of_stock" class="tab-btn shrink-0 px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-white text-gray-500 border border-gray-200 hover:text-gray-700 hover:border-gray-400 transition-all hover:-translate-y-0.5 shadow-2xs">
                            <i class="fa-solid fa-ban text-gray-400 mr-1"></i> Agotados (0)
                        </button>
                        <button onclick="filterByTab('discount')" id="tab-discount" class="tab-btn shrink-0 px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider bg-white text-gray-500 border border-gray-200 hover:text-purple-600 hover:border-purple-300 transition-all hover:-translate-y-0.5 shadow-2xs">
                            <i class="fa-solid fa-tag text-purple-500 mr-1"></i> En Oferta
                        </button>
                    </div>
                </div>

                <!-- Barra de Filtros Avanzados y Ordenamiento (Diseño 100% Responsive) -->
                <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                    
                    <!-- Desplegables con Buscador Interactivo -->
                    <div class="flex flex-wrap items-center gap-2">
                        
                        <!-- 1. Dropdown Interactivo: Categoría -->
                        <div class="relative dropdown-container" id="dropdown-category-wrapper">
                            <button type="button" onclick="window.toggleFilterDropdown('category')" id="btn-dropdown-category" class="h-10 flex items-center justify-between gap-2 bg-slate-50 hover:bg-slate-100 border border-gray-200/90 rounded-xl px-3 text-xs font-bold text-brand-black transition-all shadow-2xs min-w-[140px] max-w-[210px]">
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <i class="fa-solid fa-folder text-brand-orange text-xs shrink-0"></i>
                                    <span class="text-[9px] font-black uppercase tracking-wider text-gray-400 shrink-0">Cat:</span>
                                    <span id="selected-category-label" class="truncate text-xs font-bold text-brand-black">Todas</span>
                                </div>
                                <i id="arrow-dropdown-category" class="fa-solid fa-chevron-down text-[9px] text-gray-400 transition-transform shrink-0"></i>
                            </button>
                            <div id="panel-dropdown-category" class="filter-dropdown-panel hidden absolute left-0 top-full mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 p-3 z-30 animate-in fade-in zoom-in-95 duration-150">
                                <div class="relative mb-2">
                                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                                    <input type="text" id="search-dropdown-category" oninput="window.filterDropdownList('category', this.value)" placeholder="Buscar categoría..." class="w-full bg-slate-50 border border-gray-200/90 rounded-xl py-2 pl-8 pr-3 text-xs font-bold text-brand-black outline-none focus:bg-white focus:border-brand-orange transition-all">
                                </div>
                                <div id="options-dropdown-category" class="max-h-56 overflow-y-auto custom-scroll space-y-1 text-xs">
                                </div>
                            </div>
                        </div>

                        <!-- 2. Dropdown Interactivo: Subcategoría -->
                        <div class="relative dropdown-container" id="dropdown-subcategory-wrapper">
                            <button type="button" onclick="window.toggleFilterDropdown('subcategory')" id="btn-dropdown-subcategory" class="h-10 flex items-center justify-between gap-2 bg-slate-50 hover:bg-slate-100 border border-gray-200/90 rounded-xl px-3 text-xs font-bold text-brand-black transition-all shadow-2xs min-w-[140px] max-w-[210px]">
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <i class="fa-solid fa-folder-tree text-brand-orange text-xs shrink-0"></i>
                                    <span class="text-[9px] font-black uppercase tracking-wider text-gray-400 shrink-0">Sub:</span>
                                    <span id="selected-subcategory-label" class="truncate text-xs font-bold text-brand-black">Todas</span>
                                </div>
                                <i id="arrow-dropdown-subcategory" class="fa-solid fa-chevron-down text-[9px] text-gray-400 transition-transform shrink-0"></i>
                            </button>
                            <div id="panel-dropdown-subcategory" class="filter-dropdown-panel hidden absolute left-0 top-full mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 p-3 z-30 animate-in fade-in zoom-in-95 duration-150">
                                <div class="relative mb-2">
                                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                                    <input type="text" id="search-dropdown-subcategory" oninput="window.filterDropdownList('subcategory', this.value)" placeholder="Buscar subcategoría..." class="w-full bg-slate-50 border border-gray-200/90 rounded-xl py-2 pl-8 pr-3 text-xs font-bold text-brand-black outline-none focus:bg-white focus:border-brand-orange transition-all">
                                </div>
                                <div id="options-dropdown-subcategory" class="max-h-56 overflow-y-auto custom-scroll space-y-1 text-xs">
                                </div>
                            </div>
                        </div>

                        <!-- 3. Dropdown Interactivo: Marca -->
                        <div class="relative dropdown-container" id="dropdown-brand-wrapper">
                            <button type="button" onclick="window.toggleFilterDropdown('brand')" id="btn-dropdown-brand" class="h-10 flex items-center justify-between gap-2 bg-slate-50 hover:bg-slate-100 border border-gray-200/90 rounded-xl px-3 text-xs font-bold text-brand-black transition-all shadow-2xs min-w-[130px] max-w-[200px]">
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <i class="fa-solid fa-copyright text-brand-orange text-xs shrink-0"></i>
                                    <span class="text-[9px] font-black uppercase tracking-wider text-gray-400 shrink-0">Marca:</span>
                                    <span id="selected-brand-label" class="truncate text-xs font-bold text-brand-black">Todas</span>
                                </div>
                                <i id="arrow-dropdown-brand" class="fa-solid fa-chevron-down text-[9px] text-gray-400 transition-transform shrink-0"></i>
                            </button>
                            <div id="panel-dropdown-brand" class="filter-dropdown-panel hidden absolute left-0 top-full mt-2 w-72 max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 p-3 z-30 animate-in fade-in zoom-in-95 duration-150">
                                <div class="relative mb-2">
                                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                                    <input type="text" id="search-dropdown-brand" oninput="window.filterDropdownList('brand', this.value)" placeholder="Buscar marca..." class="w-full bg-slate-50 border border-gray-200/90 rounded-xl py-2 pl-8 pr-3 text-xs font-bold text-brand-black outline-none focus:bg-white focus:border-brand-orange transition-all">
                                </div>
                                <div id="options-dropdown-brand" class="max-h-56 overflow-y-auto custom-scroll space-y-1 text-xs">
                                </div>
                            </div>
                        </div>

                        <!-- 4. Tipo / Auditoría -->
                        <div class="h-10 flex items-center gap-1.5 bg-slate-50 border border-gray-200/90 rounded-xl px-3 shadow-2xs">
                            <i class="fa-solid fa-layer-group text-brand-orange text-xs shrink-0"></i>
                            <span class="text-[9px] font-black uppercase tracking-wider text-gray-400 shrink-0">Tipo:</span>
                            <select id="filter-type" class="bg-transparent text-xs font-bold text-brand-black outline-none cursor-pointer">
                                <option value="all">Todos</option>
                                <option value="with_variants">Con Variantes</option>
                                <option value="simple">Simple</option>
                                <option value="no_image">Sin Foto</option>
                            </select>
                        </div>

                        <!-- 5. Botón Limpiar Filtros -->
                        <button id="btn-reset-filters" onclick="window.resetAllFilters()" class="hidden h-10 px-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-500 hover:text-brand-red hover:border-brand-red hover:bg-red-50 text-[10px] font-black uppercase tracking-wider transition flex items-center gap-1.5 shadow-2xs">
                            <i class="fa-solid fa-rotate-left"></i> Limpiar Filtros
                        </button>
                    </div>

                    <!-- Ordenamiento y Paginación por Página -->
                    <div class="flex items-center gap-2.5 pt-2 lg:pt-0 border-t lg:border-t-0 border-gray-100 justify-between lg:justify-end">
                        <div class="h-10 flex items-center gap-1.5 bg-slate-50 border border-gray-200/90 rounded-xl px-3 shadow-2xs">
                            <i class="fa-solid fa-arrow-down-short-wide text-brand-orange text-xs shrink-0"></i>
                            <span class="text-[9px] font-black uppercase tracking-wider text-gray-400 shrink-0">Orden:</span>
                            <select id="sort-by" class="bg-transparent text-xs font-bold text-brand-black outline-none cursor-pointer">
                                <option value="recent">Más Recientes</option>
                                <option value="name_asc">Nombre (A - Z)</option>
                                <option value="name_desc">Nombre (Z - A)</option>
                                <option value="stock_asc">Menor Stock</option>
                                <option value="stock_desc">Mayor Stock</option>
                                <option value="price_desc">Mayor Precio</option>
                                <option value="price_asc">Menor Precio</option>
                            </select>
                        </div>

                        <div class="h-10 flex items-center gap-1.5 text-[10px] font-bold text-gray-400 uppercase bg-slate-50 border border-gray-200/90 rounded-xl px-3 shadow-2xs">
                            <span>Ver:</span>
                            <select id="page-size-select" class="bg-transparent text-xs font-bold text-brand-black outline-none cursor-pointer">
                                <option value="15">15</option>
                                <option value="20" selected>20</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-gray-100 overflow-hidden mb-6">
                <div class="overflow-x-auto custom-scroll">
                    <table class="w-full text-left border-collapse min-w-[1000px]">
                        <thead class="bg-slate-50/50 border-b border-gray-100">
                            <tr>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest w-24 text-center">Img</th>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest min-w-[220px]">Producto</th>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest whitespace-nowrap min-w-[170px]">Categoría</th>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest whitespace-nowrap">Marca</th>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest whitespace-nowrap">Precio / Stock</th>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest text-center whitespace-nowrap">Estado</th>
                                <th class="p-6 text-[9px] font-black uppercase text-gray-400 tracking-widest text-right whitespace-nowrap">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-gray-50 font-medium text-sm text-brand-black">
                        </tbody>
                    </table>
                </div>
                <div id="no-results" class="hidden p-16 text-center"></div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center px-4 gap-4">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                    Mostrando <span id="view-range" class="text-brand-black font-black">0-0</span> de <span id="total-count" class="text-brand-black font-black">0</span> productos filtrados
                </p>
                <div class="flex gap-2">
                    <button id="btn-prev-page" onclick="changePage(-1)" disabled 
                        class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-400 text-xs font-bold uppercase disabled:opacity-40 disabled:cursor-not-allowed hover:border-brand-orange hover:text-brand-orange transition shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-chevron-left"></i> Anterior
                    </button>
                    <button id="btn-next-page" onclick="changePage(1)" disabled
                        class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-400 text-xs font-bold uppercase disabled:opacity-40 disabled:cursor-not-allowed hover:border-brand-orange hover:text-brand-orange transition shadow-sm flex items-center gap-1">
                        Siguiente <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div id="discount-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl animate-in zoom-in-95 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-xl font-black uppercase text-brand-black">Aplicar <span class="text-brand-orange">Descuento</span></h3>
                    <p id="d-prod-name" class="text-xs font-bold text-gray-400 mt-1">Producto...</p>
                </div>
                <button onclick="closeDiscountModal()" class="w-10 h-10 rounded-full bg-slate-50 text-gray-400 hover:text-red-500 transition flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="discount-form" class="space-y-5">
                
                <div id="single-price-container" class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-[9px] font-black text-gray-400 uppercase tracking-widest mb-2">Precio Original</label>
                        <input type="text" id="d-original-price" disabled class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3 text-sm font-bold text-gray-400 cursor-not-allowed">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-[9px] font-black text-brand-orange uppercase tracking-widest mb-2">Precio Oferta</label>
                        <input type="text" id="d-new-price" class="currency-input w-full bg-white border-2 border-brand-orange/20 rounded-xl p-3 text-sm font-black text-brand-black outline-none focus:border-brand-orange transition shadow-sm" placeholder="$ 0">
                    </div>
                </div>

                <div id="variants-discount-container" class="hidden flex flex-col gap-2 max-h-48 overflow-y-auto pr-1 no-scrollbar border border-gray-100 rounded-xl p-3 bg-slate-50">
                </div>

                <hr class="border-gray-100">

                <div>
                    <label class="block text-[9px] font-black text-gray-400 uppercase tracking-widest mb-3">Duración de la Promoción</label>
                    <div class="flex bg-slate-50 p-1 rounded-xl mb-4">
                        <button type="button" onclick="toggleDurationType('days')" id="btn-type-days" class="flex-1 py-2 rounded-lg text-[10px] font-black uppercase transition-all bg-white shadow-sm text-brand-black">Por Días</button>
                        <button type="button" onclick="toggleDurationType('date')" id="btn-type-date" class="flex-1 py-2 rounded-lg text-[10px] font-black uppercase transition-all text-gray-400 hover:text-brand-black">Hasta Fecha</button>
                    </div>

                    <div id="input-days-container">
                        <div class="relative">
                            <input type="number" id="d-duration-days" placeholder="Ej: 3" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-brand-orange">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-gray-400">Días</span>
                        </div>
                        <p class="text-[9px] text-gray-400 mt-2 italic">La oferta expirará automáticamente.</p>
                    </div>

                    <div id="input-date-container" class="hidden">
                        <input type="datetime-local" id="d-duration-date" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-brand-orange text-gray-600">
                        <p class="text-[9px] text-brand-orange mt-2 italic font-bold">Ajusta la fecha y hora de expiración.</p>
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="removeDiscount()" id="btn-remove-discount" class="hidden flex-1 bg-red-50 text-red-500 py-3 rounded-xl font-black text-[10px] uppercase hover:bg-red-500 hover:text-white transition shadow-sm">
                        Quitar
                    </button>
                    <button type="submit" class="flex-[2] bg-brand-black text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-brand-orange hover:text-white transition shadow-lg">
                        Aplicar Descuento
                    </button>
                </div>
            </form>
        </div>
    </div>
